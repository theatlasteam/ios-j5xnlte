name: probe-xnu3789

# Documented feasibility check for building an arm64 (iOS 10) kernel from the
# public xnu-3789 source tree.
#
# EXPECTED RESULT: this fails at configuration discovery, because the public
# xnu-3789 tree ships only config/*_x86_64. Apple never published arm64 kernel
# configs for the iOS 10 era. This workflow exists to make that finding
# reproducible instead of anecdotal.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-xnu3789.yml"

jobs:
  probe:
    runs-on: macos-13
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone public xnu-3789.70.16
        run: |
          git clone --depth 1 --branch xnu-3789.70.16 \
            https://github.com/apple-oss-distributions/xnu.git xnu-3789

      - name: Inspect kernel configurations
        run: |
          echo "### config/ contents" | tee report.md
          ls xnu-3789/config | tee -a report.md
          echo "" | tee -a report.md
          if ls xnu-3789/config | grep -qi 'arm'; then
            echo "arm/arm64 configs: PRESENT" | tee -a report.md
          else
            echo "arm/arm64 configs: **ABSENT** — arm64 kernel cannot be configured" | tee -a report.md
          fi
          {
            echo ""
            echo "### x86_64-only proof"
            echo '```'
            ls xnu-3789/config | grep x86_64 || true
            echo '```'
          } | tee -a report.md

      - name: Attempt arm64 build (expected to fail)
        continue-on-error: true
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          make -C xnu-3789 SDKROOT="$SDK" ARCH_CONFIGS=ARM64 \
            KERNEL_CONFIGS=DEVELOPMENT -j"$(sysctl -n hw.ncpu)" 2>&1 | tee build-arm64.log || true

      - name: Summarize outcome
        if: always()
        run: |
          {
            echo ""
            echo "### arm64 build attempt"
            if [ -f build-arm64.log ]; then
              tail -n 25 build-arm64.log
            else
              echo "no log produced"
            fi
          } | tee -a report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu3789-probe
          path: |
            report.md
            build-arm64.log
          retention-days: 14
