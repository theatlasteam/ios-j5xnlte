name: probe-xnu

# Reproducible feasibility report for building an arm64 (iOS) kernel from the
# PUBLIC XNU source, plus a first clean build attempt at iOS 12 (xnu-4903).
#
# Key finding: the public xnu-3789 (iOS 10) tree is x86_64-only, but arm64
# configs appear from xnu-4570 (iOS 11) onward. No Apple firmware/decryption
# is involved anywhere in this workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: XNU tag to attempt building
        default: xnu-4903.221.2
  push:
    paths:
      - ".github/workflows/probe-xnu.yml"

jobs:
  probe:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || 'xnu-4903.221.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe arm64 config ladder
        run: |
          {
            echo "## arm64 kernel-config presence per XNU generation"
            echo ""
            echo "| tag | MASTER.arm64* configs |"
            echo "|---|---|"
            for t in xnu-3789.70.16 xnu-4570.71.2 xnu-4903.221.2 xnu-6153.141.1 xnu-7195.141.2; do
              n=$(curl -s "https://api.github.com/repos/apple-oss-distributions/xnu/contents/config?ref=$t" \
                  | grep -oE '"name": "MASTER\.arm64[^"]*"' | wc -l | tr -d ' ')
              echo "| $t | $n |"
            done
          } | tee report.md

      - name: Clone selected XNU
        run: git clone --depth 1 --branch "$TAG" https://github.com/apple-oss-distributions/xnu.git xnu

      - name: Show arm64 configs
        run: ls xnu/config | grep -E 'MASTER\.arm64|arm64.*exports' | tee -a report.md || true

      - name: Modernize python2 build scripts for py3
        run: |
          set -e
          # absolute shebangs -> env python3
          grep -rl '^#!/usr/bin/python' xnu --include='*.py' 2>/dev/null \
            | xargs -r sed -i '' 's|^#!/usr/bin/python$|#!/usr/bin/env python3|' || true
          # bsd/kern/makekdebugevents.py is py2-only; replace with an equivalent py3 version
          cat > xnu/bsd/kern/makekdebugevents.py <<'PY'
          #!/usr/bin/env python3
          import sys, re
          if len(sys.argv) < 2:
              sys.exit(1)
          code_table = []
          pat = re.compile(r'0x([0-9a-fA-F]+)\s+([^\s]*)')
          with open(sys.argv[1], 'rt') as codes:
              for line in codes:
                  m = pat.match(line)
                  if m:
                      code_table.append((int(m.group(1), 16), m.group(2)))
          print("typedef struct {")
          print("        uint32_t   id;")
          print("        const char *name;")
          print("} kd_event_t;")
          print("kd_event_t kd_events[] = {")
          for mapping in sorted(code_table, key=lambda x: x[0]):
              print('        {0x%x, "%s"},' % mapping)
          print("};")
          PY
          # Xcode removed ctfconvert/ctfmerge; provide no-op stubs
          mkdir -p "$HOME/ctfbin"
          for t in ctfconvert ctfmerge; do
            printf '#!/bin/sh\nexit 0\n' > "$HOME/ctfbin/$t"; chmod +x "$HOME/ctfbin/$t"
          done
          echo "$HOME/ctfbin" >> "$GITHUB_PATH"
          # The public tree derives -arch from Apple's internal 'edm' tool
          # (not shipped publicly), leaving ARCH_FLAGS_ARM64 empty. Pin it.
          cat >> xnu/makedefs/MakeInc.def <<'MK'
          ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG := arm64
          ARCH_FLAGS_ARM64 = -arch arm64
          CFLAGS_GEN += -Wno-error=missing-include-dirs -Wno-missing-include-dirs -Wno-implicit-function-declaration -Wno-int-conversion
          WERROR :=
          WARNFLAGS += -Wno-error -Wno-declaration-after-statement -Wno-pre-c11-compat -Wno-suggest-override -Wno-implicit-function-declaration
          SFLAGS_GEN += -x assembler-with-cpp
          MK
          tail -n 7 xnu/makedefs/MakeInc.def
          # modern clang turns many old constructs into warnings; drop -Werror outright
          grep -rl -- '-Werror' xnu/makedefs 2>/dev/null | xargs -r sed -i '' 's/-Werror//g' || true
          echo "remaining -Werror refs: $(grep -rl -- '-Werror' xnu/makedefs 2>/dev/null | wc -l | tr -d ' ')"
          # dirs the 2018 build references before creating (or from the KDK)
          mkdir -p xnu/BUILD/obj/EXPORT_HDRS/libsa
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          sudo mkdir -p "$SDK/usr/local/include/kernel/os"
          # Only the one private header old XNU needs. Copying the whole KDK
          # tree duplicates #defines and breaks genassym.
          echo "--- KDK inventory ---"
          sudo ls /Library/Developer/KDKs 2>/dev/null || echo "no /Library/Developer/KDKs"
          f=$(sudo find /Library/Developer/KDKs -name 'firehose_buffer_private.h' 2>/dev/null | head -1)
          if [ -n "$f" ]; then
            sudo cp "$f" "$SDK/usr/local/include/kernel/os/"
            echo "firehose header: copied from $f"
          else
            echo "firehose header: NOT FOUND in KDK"
          fi
          # Public tree lacks the closed libfirehose_kernel. Stub the two
          # tracepoint functions + chunk count so the kernel can build and boot.
          cat > /tmp/firehose_buffer_private.h <<'HF'
          #ifndef __os_firehose_buffer_private_h
          #define __os_firehose_buffer_private_h
          #include <stdbool.h>
          #include <stdint.h>
          #include <firehose/firehose_types_private.h>
          #include <firehose/tracepoint_private.h>
          #include <firehose/chunk_private.h>
          #define FIREHOSE_BUFFER_KERNEL_CHUNK_COUNT 1
          #define FIREHOSE_BUFFER_KERNEL_DEFAULT_CHUNK_COUNT 2
          #define FIREHOSE_BUFFER_KERNEL_DEFAULT_IO_PAGES 1
          static inline bool
          __firehose_kernel_configuration_valid(uint8_t chunk_count, uint8_t io_pages)
          {
            (void)chunk_count; (void)io_pages;
            return true;
          }
          static inline firehose_tracepoint_t
          __firehose_buffer_tracepoint_reserve(uint64_t stamp, firehose_stream_t stream,
              uint16_t publen, uint8_t qos, void *trace_id)
          {
            (void)stamp; (void)stream; (void)publen; (void)qos; (void)trace_id;
            return (firehose_tracepoint_t)0;
          }
          static inline void
          __firehose_buffer_tracepoint_flush(firehose_tracepoint_t ft, firehose_tracepoint_id_u ftid)
          {
            (void)ft; (void)ftid;
          }
          #endif
          HF
          sudo cp /tmp/firehose_buffer_private.h "$SDK/usr/local/include/kernel/os/firehose_buffer_private.h"
          echo "firehose shim installed"

      - name: Replace fragile sed assym generator with deduping parser
        run: |
          set -e
          cat > "$HOME/assym.py" <<'PY'
          import re, sys
          data = open(sys.argv[1], 'r', errors='replace').read()
          labels = [(m.start(), m.group(1)) for m in
                    re.finditer(r'DEFINITION__define__([A-Za-z0-9_]+):', data)]
          seen = {}
          missing = []
          for pos, name in labels:
              if name in seen:
                  continue
              m = re.search(r'\.ascii\s*"([^"]*)"', data[pos:pos + 400])
              if not m:
                  missing.append(name)
                  continue
              seen[name] = m.group(1).lstrip('$#')
          for name, val in seen.items():
              print('#define %s %s' % (name, val))
              print('#define %s_NUM %s' % (name, val))
          sys.stderr.write('assym.py: %d labels, %d defs, missing=%s\n'
                           % (len(labels), len(seen), ','.join(missing)))
          PY
          python3 - <<'PY'
          p = 'xnu/osfmk/conf/Makefile.template'
          lines = open(p).read().splitlines()
          hits = 0
          out = []
          for ln in lines:
              if 'genassym.o > $@' in ln:
                  out.append('\t$(_v)python3 $(HOME)/assym.py genassym.o > $@')
                  hits += 1
              else:
                  out.append(ln)
          open(p, 'w').write('\n'.join(out) + '\n')
          print('patched assym rule occurrences:', hits)
          PY

      - name: Attempt arm64 build
        continue-on-error: true
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDKROOT=$SDK" | tee build.log
          make -C xnu SDKROOT="$SDK" ARCH_CONFIGS=ARM64 \
            KERNEL_CONFIGS=DEVELOPMENT -j"$(sysctl -n hw.ncpu)" 2>&1 | tee -a build.log || true

      - name: Debug assym generation
        if: always()
        run: |
          {
            echo "## assym debug"
            find xnu/BUILD -name 'assym.s' | head -5
            for f in $(find xnu/BUILD -name 'assym.s' | head -3); do
              echo "== $f ($(wc -l < "$f" 2>/dev/null) lines)"
              grep -n 'SS64_FP\|MAX_CPUS\|cdeSize' "$f" || echo "(missing defines)"
            done
            for g in $(find xnu/BUILD -name 'genassym.o' | head -3); do
              echo "== $g labels=$(grep -c 'DEFINITION__define__' "$g" 2>/dev/null)"
              grep -n -A1 'DEFINITION__define__MAX_CPUS\|DEFINITION__define__cdeSize' "$g" | head -12
            done
          } | tee assym-debug.txt

      - name: Summarize
        if: always()
        run: |
          {
            echo ""
            echo "## build attempt: $TAG (ARCH_CONFIGS=ARM64)"
            echo '```'
            tail -n 30 build.log 2>/dev/null || echo "no log"
            echo '```'
            echo ""
            ls -la xnu/BUILD/obj/DEVELOPMENT_ARM64/kernel.development 2>/dev/null || echo "no kernel artifact produced"
          } | tee -a report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-probe
          path: |
            report.md
            build.log
            assym-debug.txt
          retention-days: 14
