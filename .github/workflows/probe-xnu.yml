name: probe-xnu

# Reproducible feasibility report for building an arm64 (iOS) kernel from the
# PUBLIC XNU source, plus a first clean build attempt at iOS 12 (xnu-4903).
#
# Key finding: the public xnu-3789 (iOS 10) tree is x86_64-only, but arm64
# configs appear from xnu-4570 (iOS 11) onward. No Apple firmware/decryption
# is involved anywhere in this workflow.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: XNU tag to attempt building
        default: xnu-4903.221.2
  push:
    paths:
      - ".github/workflows/probe-xnu.yml"

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag || 'xnu-4903.221.2' }}
    steps:
      - uses: actions/checkout@v4

      - name: Probe arm64 config ladder
        run: |
          {
            echo "## arm64 kernel-config presence per XNU generation"
            echo ""
            echo "| tag | MASTER.arm64* configs |"
            echo "|---|---|"
            for t in xnu-3789.70.16 xnu-4570.71.2 xnu-4903.221.2 xnu-6153.141.1 xnu-7195.141.2; do
              n=$(curl -s "https://api.github.com/repos/apple-oss-distributions/xnu/contents/config?ref=$t" \
                  | grep -oE '"name": "MASTER\.arm64[^"]*"' | wc -l | tr -d ' ')
              echo "| $t | $n |"
            done
          } | tee report.md

      - name: Clone selected XNU
        run: git clone --depth 1 --branch "$TAG" https://github.com/apple-oss-distributions/xnu.git xnu

      - name: Show arm64 configs
        run: ls xnu/config | grep -E 'MASTER\.arm64|arm64.*exports' | tee -a report.md || true

      - name: Modernize python2 build scripts for py3
        run: |
          set -e
          # absolute shebangs -> env python3
          grep -rl '^#!/usr/bin/python' xnu --include='*.py' 2>/dev/null \
            | xargs -r sed -i '' 's|^#!/usr/bin/python$|#!/usr/bin/env python3|' || true
          # bsd/kern/makekdebugevents.py is py2-only; replace with an equivalent py3 version
          cat > xnu/bsd/kern/makekdebugevents.py <<'PY'
          #!/usr/bin/env python3
          import sys, re
          if len(sys.argv) < 2:
              sys.exit(1)
          code_table = []
          pat = re.compile(r'0x([0-9a-fA-F]+)\s+([^\s]*)')
          with open(sys.argv[1], 'rt') as codes:
              for line in codes:
                  m = pat.match(line)
                  if m:
                      code_table.append((int(m.group(1), 16), m.group(2)))
          print("typedef struct {")
          print("        uint32_t   id;")
          print("        const char *name;")
          print("} kd_event_t;")
          print("kd_event_t kd_events[] = {")
          for mapping in sorted(code_table, key=lambda x: x[0]):
              print('        {0x%x, "%s"},' % mapping)
          print("};")
          PY
          # Xcode removed ctfconvert/ctfmerge; provide no-op stubs
          mkdir -p "$HOME/ctfbin"
          for t in ctfconvert ctfmerge; do
            printf '#!/bin/sh\nexit 0\n' > "$HOME/ctfbin/$t"; chmod +x "$HOME/ctfbin/$t"
          done
          echo "$HOME/ctfbin" >> "$GITHUB_PATH"
          # The public tree derives -arch from Apple's internal 'edm' tool
          # (not shipped publicly), leaving ARCH_FLAGS_ARM64 empty. Pin it.
          cat >> xnu/makedefs/MakeInc.def <<'MK'
          ARCH_STRING_FOR_CURRENT_MACHINE_CONFIG := arm64
          ARCH_FLAGS_ARM64 = -arch arm64
          CFLAGS_GEN += -Wno-error=missing-include-dirs -Wno-missing-include-dirs
          MK
          tail -n 3 xnu/makedefs/MakeInc.def
          # dirs the 2018 build references before creating (or from the KDK)
          mkdir -p xnu/BUILD/obj/EXPORT_HDRS/libsa
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          sudo mkdir -p "$SDK/usr/local/include/kernel"

      - name: Attempt arm64 build
        continue-on-error: true
        run: |
          set -o pipefail
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "SDKROOT=$SDK" | tee build.log
          make -C xnu SDKROOT="$SDK" ARCH_CONFIGS=ARM64 \
            KERNEL_CONFIGS=DEVELOPMENT -j"$(sysctl -n hw.ncpu)" 2>&1 | tee -a build.log || true

      - name: Summarize
        if: always()
        run: |
          {
            echo ""
            echo "## build attempt: $TAG (ARCH_CONFIGS=ARM64)"
            echo '```'
            tail -n 30 build.log 2>/dev/null || echo "no log"
            echo '```'
            echo ""
            ls -la xnu/BUILD/obj/DEVELOPMENT_ARM64/kernel.development 2>/dev/null || echo "no kernel artifact produced"
          } | tee -a report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-arm64-probe
          path: |
            report.md
            build.log
          retention-days: 14
